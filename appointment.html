<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section class="section">

        <div class="container">

            <div class="section-heading center">

                <span class="eyebrow">
                    APPOINTMENT
                </span>

                <h1>
                    Book a Healthcare Consultation
                </h1>

                <p>
                    Share your requirements and preferred
                    appointment details.
                </p>

            </div>


            <div class="form-card">

                <form>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>
                                Full Name *
                            </label>

                            <input type="text" required placeholder="Full name">

                        </div>


                        <div class="form-group">

                            <label>
                                Email *
                            </label>

                            <input type="email" required placeholder="Email address">

                        </div>


                        <div class="form-group">

                            <label>
                                Phone / WhatsApp *
                            </label>

                            <input type="tel" required placeholder="+1 234 567 890">

                        </div>


                        <div class="form-group">

                            <label>
                                Country *
                            </label>

                            <select required>

                                <option value="">
                                    Select country
                                </option>

                                <option>United States</option>
                                <option>United Kingdom</option>
                                <option>Canada</option>
                                <option>Australia</option>
                                <option>UAE</option>
                                <option>Other</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Treatment *
                            </label>

                            <select required>

                                <option value="">
                                    Select treatment
                                </option>

                                <option>
                                    Cancer
                                </option>

                                <option>
                                    Cardiology
                                </option>

                                <option>
                                    Orthopedics
                                </option>

                                <option>
                                    Neurology
                                </option>

                                <option>
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Preferred Date
                            </label>

                            <input type="date">

                        </div>


                        <div class="form-group">

                            <label>
                                Preferred Time
                            </label>

                            <select>

                                <option>Morning</option>
                                <option>Afternoon</option>
                                <option>Evening</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Preferred Communication
                            </label>

                            <select>

                                <option>
                                    WhatsApp
                                </option>

                                <option>
                                    Phone Call
                                </option>

                                <option>
                                    Email
                                </option>

                            </select>

                        </div>


                        <div class="form-group full">

                            <label>
                                Additional Information
                            </label>

                            <textarea placeholder="Tell us anything else we should know..."></textarea>

                        </div>

                    </div>


                    <label class="checkbox">

                        <input type="checkbox" required>

                        <span>
                            I agree to the privacy policy and
                            consent to being contacted.
                        </span>

                    </label>


                    <button type="submit" class="btn btn-primary">
                        Request Appointment
                    </button>
                </form>
            </div>

        </div>

    </section>
</body>
<script src="./js/script.js"></script>

</html>
